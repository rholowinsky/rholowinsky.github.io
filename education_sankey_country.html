  #body { flex: 1; display: flex; min-height: 0; }

  #sidebar { width: 240px; background: #1a1d27; padding: 12px; overflow-y: auto; border-right: 1px solid #2d3148; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .panel { background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 11px; }
  .panel h3 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px; color: #a78bfa; margin-bottom: 9px; }

  label { font-size: 11px; color: #9ca3af; display: block; margin-bottom: 3px; }
  select, input[type=range], input[type=number] {
    width: 100%; background: #1a1d27; border: 1px solid #2d3148;
    color: #e5e7eb; border-radius: 4px; padding: 4px 7px;
    font-size: 12px; margin-bottom: 7px;
  }
  select:focus, input:focus { outline: none; border-color: #a78bfa; }
  input[type=range] { padding: 0; accent-color: #a78bfa; cursor: pointer; }
  .range-row { display: flex; gap: 6px; }
  .range-row input { flex: 1; }
  .range-display { font-size: 11px; color: #e5e7eb; text-align: center; margin-top: -4px; margin-bottom: 7px; }

  .btn { border: none; border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: 11px; font-weight: 600; width: 100%; transition: all 0.15s; margin-top: 4px; }
  .btn-primary { background: #7c3aed; color: #fff; }
  .btn-primary:hover { background: #6d28d9; }
  .btn-outline { background: transparent; border: 1px solid #2d3148; color: #9ca3af; }
  .btn-outline:hover { border-color: #a78bfa; color: #a78bfa; }

  #stats table { width: 100%; border-collapse: collapse; font-size: 11px; }
  #stats td { padding: 2px 0; }
  #stats td:last-child { text-align: right; color: #e5e7eb; font-weight: 600; }

  #chart { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; }
  #chart svg { display: block; }

  #tooltip {
    position: fixed; background: #1a1d27; border: 1px solid #2d3148;
    border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #e5e7eb;
    pointer-events: none; opacity: 0; transition: opacity 0.12s;
    max-width: 260px; z-index: 999; line-height: 1.6;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #tooltip.visible { opacity: 1; }
  #tooltip b { color: #a78bfa; }

  .pinned-label { font-size: 10px; color: #a78bfa; margin-top: 4px; text-align: center; min-height: 14px; }

// BUILD
// ═══════════════════════════════════════════════════════════════
function buildData() {
  const minFlow      = parseInt(getVal('minFlow'));
  const yearFrom     = parseInt(getVal('yearFrom'));
  const yearTo       = parseInt(getVal('yearTo'));
  const countryFilter= getVal('countryFilter').trim();
  const countryMode  = getVal('countryMode');

  let flows = RAW_FLOWS.filter(f => {
    if (f.year < yearFrom || f.year > yearTo) return false;
    if (countryFilter) {
      const sm = f.src === countryFilter;
      const tm = f.tgt === countryFilter;
      if (countryMode === 'any' && !sm && !tm) return false;
      if (countryMode === 'src' && !sm) return false;
      if (countryMode === 'tgt' && !tm) return false;
    }
    return true;
  });

  // Aggregate into edge counts
  const edgeMap = {};
  flows.forEach(f => {
    const k = `${f.src_tier}|||${f.src}|||${f.tgt_tier}|||${f.tgt}`;
    edgeMap[k] = (edgeMap[k] || 0) + 1;
  });

  // Build nodes + links — no "Other" bucket, no filtering by top-N
  const nodeMap = {};
  const nodes   = [];
  const links   = [];

  function ensureNode(tier, name) {
    const key = `${tier}|||${name}`;
    if (!(key in nodeMap)) {
      nodeMap[key] = nodes.length;
      nodes.push({ tier, name, key, value: 0 });
    }
    return nodeMap[key];
  }

  Object.entries(edgeMap).forEach(([k, cnt]) => {
    if (cnt < minFlow) return;
    const [srcTier, srcName, tgtTier, tgtName] = k.split('|||');
    const si = ensureNode(srcTier, srcName);
    const ti = ensureNode(tgtTier, tgtName);
    nodes[si].value += cnt;
    nodes[ti].value += cnt;
    links.push({ source: si, target: ti, value: cnt,
                 srcTier, srcName, tgtTier, tgtName });
  });

  // Stats
  const ugms  = flows.filter(f => f.src_tier==='Undergraduate' && f.tgt_tier==='Masters').length;
  const msphd = flows.filter(f => f.src_tier==='Masters'       && f.tgt_tier==='PhD').length;
  const ugphd = flows.filter(f => f.src_tier==='Undergraduate' && f.tgt_tier==='PhD').length;
  const ugN   = new Set(nodes.filter(n => n.tier==='Undergraduate').map(n => n.name)).size;
  const msN   = new Set(nodes.filter(n => n.tier==='Masters').map(n => n.name)).size;
  const phdN  = new Set(nodes.filter(n => n.tier==='PhD').map(n => n.name)).size;

  setTxt('statFlows', flows.length.toLocaleString());
  setTxt('statUGMS',  ugms.toLocaleString());
  setTxt('statMSPhD', msphd.toLocaleString());
  setTxt('statUGPhD', ugphd.toLocaleString());
  setTxt('statUGN',   ugN);
  setTxt('statMSN',   msN);
  setTxt('statPhDN',  phdN);
  document.getElementById('flowCount').textContent =
    links.length.toLocaleString() + ' visible edges';

  return { nodes, links };
}

function render() {
  pinnedNode = null;

  const { nodes, links } = buildData();

  // Compute minimum height needed to show all nodes without crushing them
  const maxNodes = Math.max(
    nodes.filter(n=>n.tier==='Undergraduate').length,
    nodes.filter(n=>n.tier==='Masters').length,
    nodes.filter(n=>n.tier==='PhD').length
  );
  const minNodeH   = 14;  // minimum px per node
  const minH       = MARGIN.top + MARGIN.bottom + maxNodes * (minNodeH + PAD);
  const viewportH  = svg.parentElement.clientHeight;
  const H          = Math.max(viewportH, minH);

  svg.setAttribute('width',  W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = '';

  if (!nodes.length) {
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', W/2); t.setAttribute('y', H/2);
    t.setAttribute('text-anchor','middle'); t.setAttribute('fill','#6b7280');
    t.setAttribute('font-size','14'); t.textContent = 'No flows match the current filters.';
    svg.appendChild(t); return;
  }

  // Column x positions — spread evenly between margins
  const usableW = W - MARGIN.left - MARGIN.right - NODE_W;
  const colX = tier => MARGIN.left + COL_X_FRAC[tier] * usableW;

  // Sort nodes within each tier by value desc
  const cols = { Undergraduate: [], Masters: [], PhD: [] };
  nodes.forEach((n, i) => cols[n.tier]?.push(i));
  Object.values(cols).forEach(arr => arr.sort((a,b) => nodes[b].value - nodes[a].value));

  // Compute y positions
  const usableH  = H - MARGIN.top - MARGIN.bottom;
  const nodePos  = new Array(nodes.length);

  Object.entries(cols).forEach(([tier, arr]) => {
    if (!arr.length) return;
    const totalVal = arr.reduce((s, i) => s + nodes[i].value, 0);
    const totalPad = PAD * (arr.length - 1);
    const scale    = (usableH - totalPad) / (totalVal || 1);
    let y = MARGIN.top;
    arr.forEach(ni => {
      const h = Math.max(4, nodes[ni].value * scale);
      nodePos[ni] = { x: colX(nodes[ni].tier), y, h };
      y += h + PAD;
    });
  });

  // Link offsets
  const srcOff = new Array(nodes.length).fill(0);
  const tgtOff = new Array(nodes.length).fill(0);
  const sortedLinks = [...links].sort((a,b) => b.value - a.value);
  svgLinks = sortedLinks;

  sortedLinks.forEach((lk, li) => {
    const sn = nodePos[lk.source], tn = nodePos[lk.target];
    if (!sn || !tn) return;

    const scaleS = sn.h / (links.filter(l => l.source===lk.source).reduce((s,l)=>s+l.value,0)||1);
    const scaleT = tn.h / (links.filter(l => l.target===lk.target).reduce((s,l)=>s+l.value,0)||1);
    const lh  = lk.value * Math.min(scaleS, scaleT);
    const sy1 = sn.y + srcOff[lk.source];
    const sy2 = sy1 + lh;
    const ty1 = tn.y + tgtOff[lk.target];
    const ty2 = ty1 + lh;
    srcOff[lk.source] += lh;
    tgtOff[lk.target] += lh;

    const x1 = sn.x + NODE_W, x2 = tn.x;
    const cx = (x1 + x2) / 2;
    const d  = `M${x1},${sy1} C${cx},${sy1} ${cx},${ty1} ${x2},${ty1}
                L${x2},${ty2} C${cx},${ty2} ${cx},${sy2} ${x1},${sy2} Z`;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('fill', TIER_COLORS[lk.tgtTier].edge);
    path.setAttribute('stroke','none');
    path.dataset.li = li;

    path.addEventListener('mouseenter', e => {
      if (pinnedNode !== null) return;
      path.setAttribute('fill', brightEdge(lk.tgtTier));
      showTip(e, `<b>${lk.srcName}</b> <span style="color:#6b7280">(${lk.srcTier})</span><br>
        &#8595; <b>${lk.value.toLocaleString()}</b> people<br>
        <b>${lk.tgtName}</b> <span style="color:#6b7280">(${lk.tgtTier})</span>`);
    });
    path.addEventListener('mouseleave', e => {
      if (pinnedNode !== null) return;
      path.setAttribute('fill', TIER_COLORS[lk.tgtTier].edge);
      hideTip();
    });
    path.addEventListener('mousemove', moveTip);

    svg.appendChild(path);
    svgLinkEls.push(path);
  });

  // Nodes
  nodes.forEach((n, ni) => {
    const pos = nodePos[ni];
    if (!pos) return;

    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', pos.x);
    rect.setAttribute('y', pos.y);
    rect.setAttribute('width',  NODE_W);
    rect.setAttribute('height', Math.max(4, pos.h));
    rect.setAttribute('fill',   TIER_COLORS[n.tier].node);
    rect.setAttribute('rx', 3);
    rect.style.cursor = 'pointer';

    // Label
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    const MAX_L = 22;
    const label = n.name.length > MAX_L ? n.name.slice(0, MAX_L-1) + '…' : n.name;
    txt.setAttribute('font-size', '11');
    txt.setAttribute('fill', '#d1d5db');
    txt.style.pointerEvents = 'none';
    txt.setAttribute('y', pos.y + pos.h / 2 + 4);

    if (n.tier === 'Undergraduate') {
      txt.setAttribute('x', pos.x + NODE_W + 5);
      txt.setAttribute('text-anchor', 'start');
    } else if (n.tier === 'PhD') {
      txt.setAttribute('x', pos.x - 5);
      txt.setAttribute('text-anchor', 'end');
    } else {
      txt.setAttribute('x', pos.x + NODE_W / 2);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('y', pos.y - 4);
    }
    txt.textContent = label;

    rect.addEventListener('mouseenter', e => {
      if (pinnedNode !== null) return;
      hlNode(ni, true);
      const inv  = links.filter(l=>l.target===ni).reduce((s,l)=>s+l.value,0);
      const outv = links.filter(l=>l.source===ni).reduce((s,l)=>s+l.value,0);
      showTip(e, `<b>${n.name}</b><br>${n.tier}<br>
        In: ${inv.toLocaleString()} &nbsp;|&nbsp; Out: ${outv.toLocaleString()}<br>
        <span style="color:#6b7280;font-size:10px">Click to pin</span>`);
    });
    rect.addEventListener('mouseleave', e => {
      if (pinnedNode !== null) return;
      hlNode(ni, false); hideTip();
    });
    rect.addEventListener('mousemove', moveTip);
    rect.addEventListener('click', () => togglePin(ni, n, links));

    svg.appendChild(txt);
    svg.appendChild(rect);
  });

  // Tier column labels — anchored to match their node label side
  ['Undergraduate','Masters','PhD'].forEach(tier => {
    const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('y', MARGIN.top - 16);
    lbl.setAttribute('font-size', '12');
    lbl.setAttribute('font-weight', '700');
    lbl.setAttribute('fill', TIER_COLORS[tier].node);
    lbl.style.pointerEvents = 'none';
    if (tier === 'Undergraduate') {
      lbl.setAttribute('x', colX(tier) + NODE_W + 5);
      lbl.setAttribute('text-anchor', 'start');
    } else if (tier === 'PhD') {
      lbl.setAttribute('x', colX(tier) - 5);
      lbl.setAttribute('text-anchor', 'end');
    } else {
      lbl.setAttribute('x', colX(tier) + NODE_W / 2);
      lbl.setAttribute('text-anchor', 'middle');
    }
    lbl.textContent = tier;
    svg.appendChild(lbl);
  });
}

// ═══════════════════════════════════════════════════════════════
// HIGHLIGHT
// ═══════════════════════════════════════════════════════════════
function brightEdge(tier) {
  const c = TIER_COLORS[tier].node;  // hex string e.g. '#60a5fa'
  const r = parseInt(c.slice(1, 3), 16);
  const g = parseInt(c.slice(3, 5), 16);
  const b = parseInt(c.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${HOVER_ALPHA})`;
}

function hlNode(ni, on) {
  svgLinkEls.forEach((path, li) => {
    const lk = svgLinks[li];
    if (!lk) return;
    const conn = lk.source === ni || lk.target === ni;
    path.setAttribute('fill', on
      ? (conn ? brightEdge(lk.tgtTier) : DIM_EDGE)
      : TIER_COLORS[lk.tgtTier].edge);
  });
}

// ═══════════════════════════════════════════════════════════════
// PIN
// ═══════════════════════════════════════════════════════════════
function togglePin(ni, n, links) {
  if (pinnedNode === ni) {
    pinnedNode = null;
    hlNode(ni, false);
    hideTip();
    document.getElementById('pinnedLabel').textContent = '';
    document.getElementById('unpinBtn').style.display = 'none';
  } else {
    if (pinnedNode !== null) hlNode(pinnedNode, false);
    pinnedNode = ni;
    hlNode(ni, true);
    const inv  = links.filter(l=>l.target===ni).reduce((s,l)=>s+l.value,0);
    const outv = links.filter(l=>l.source===ni).reduce((s,l)=>s+l.value,0);
    showTip(null, `<b>${n.name}</b><br>${n.tier}<br>In: ${inv.toLocaleString()} | Out: ${outv.toLocaleString()}`);
    document.getElementById('pinnedLabel').textContent = '\uD83D\uDCCC ' + n.name;
    document.getElementById('unpinBtn').style.display = 'block';
  }
}

document.getElementById('unpinBtn').addEventListener('click', () => {
  if (pinnedNode !== null) { hlNode(pinnedNode, false); pinnedNode = null; }
  hideTip();
  document.getElementById('pinnedLabel').textContent = '';
  document.getElementById('unpinBtn').style.display = 'none';
});

// ═══════════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════════
const tip = document.getElementById('tooltip');
function showTip(e, html) {
  tip.innerHTML = html;
  tip.classList.add('visible');
  if (e) moveTip(e);
}
function hideTip() { tip.classList.remove('visible'); }
function moveTip(e) {
  const TIP_W = 220, TIP_H = 80;  // estimated tooltip dimensions
  const vw = window.innerWidth, vh = window.innerHeight;
  // Flip left if tooltip would overflow right edge
  if (e.clientX + 14 + TIP_W > vw) {
    tip.style.left = (e.clientX - TIP_W - 10) + 'px';
  } else {
    tip.style.left = (e.clientX + 14) + 'px';
  }
  // Flip up if tooltip would overflow bottom edge
  if (e.clientY - 10 + TIP_H > vh) {
    tip.style.top = (e.clientY - TIP_H - 6) + 'px';
  } else {
    tip.style.top = (e.clientY - 10) + 'px';
  }
}

// ═══════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════
document.getElementById('applyBtn').addEventListener('click', render);
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('minFlow').value       = '2';
  document.getElementById('minFlowDisplay').textContent = '\u2265 2 people';
  document.getElementById('yearFrom').value      = MIN_YEAR;
  document.getElementById('yearTo').value        = MAX_YEAR;
  document.getElementById('countryFilter').value = '';
  document.getElementById('countryMode').value   = 'any';
  render();
});

window.addEventListener('resize', render);
render();
</script>
